services:
  postgres:
    image: postgres:16-alpine
    container_name: hellodoctor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hellodoctor
      POSTGRES_USER: hellodoctor
      POSTGRES_PASSWORD: hellodoctor_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellodoctor -d hellodoctor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
