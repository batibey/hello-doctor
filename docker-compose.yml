services:
  postgres:
    image: postgres:16-alpine
    container_name: hellodoctor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hellodoctor
      POSTGRES_USER: hellodoctor
      POSTGRES_PASSWORD: hellodoctor_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellodoctor -d hellodoctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SignalR backplane + görüşme durumu. Yalnızca birden fazla backend örneği
  # çalıştıracaksanız gerekli; tek örnekte uygulama süreç belleğini kullanır.
  # Bağlamak için: ConnectionStrings__Redis=localhost:6379
  redis:
    image: redis:7-alpine
    container_name: hellodoctor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Yerel SMTP yakalayıcı: şifre sıfırlama e-postaları gerçekten gönderilir ama
  # dışarı çıkmaz, http://localhost:8025 arayüzünde görünür. Gerçek bir SMTP
  # sağlayıcısına Smtp__* ortam değişkenleriyle geçilir.
  mailpit:
    image: axllent/mailpit
    container_name: hellodoctor-mail
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web arayüzü

  # Yerel ağda TURN denemek için. Varsayılan olarak başlamaz:
  #   docker compose --profile turn up -d
  # Yalnızca aynı ağdaki cihazlar için işe yarar; internet üzerinden
  # görüşme için TURN'ün genel bir IP'den erişilebilir olması gerekir.
  coturn:
    image: coturn/coturn
    container_name: hellodoctor-turn
    profiles: ["turn"]
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "49160-49170:49160-49170/udp"
    # Relay adresini konteyner IP'si (172.17.x) olarak duyurmaması için makinenin
    # LAN adresi verilmeli, yoksa karşı taraf o adrese ulaşamaz:
    #   TURN_EXTERNAL_IP=$(ipconfig getifaddr en0) docker compose --profile turn up -d
    command: >
      -n --lt-cred-mech --realm=hellodoctor
      --user=${TURN_USER:-hellodoctor}:${TURN_PASSWORD:-turn_dev_pw}
      --no-tls --no-dtls --listening-port=3478
      --min-port=49160 --max-port=49170
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}

volumes:
  pgdata:
